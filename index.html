<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitation Form</title>
    <link rel="stylesheet" href="styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside>
        <div class="aside-container">
          <header>
            <img src="assets/images/Logo.svg" alt="Logo Image" />
            <div class="aside-header-text">
              <h1>Festivite</h1>
              <p>Crie um convite digital para o seu evento</p>
            </div>
          </header>
        </div>
      </aside>
      <main>
        <div class="main-container">
          <h1>Crie seu convite</h1>

          <form method="post" enctype="multipart/form-data">
            <fieldset class="about">
              <div class="section-header">
                <img src="assets/icons/calendar.svg" alt="Calendar Icon" />
                <h1>Sobre o evento</h1>
              </div>

              <div class="input-wrapper">
                <label for="eventname">Título</label>
                <input
                  type="text"
                  for="eventname"
                  placeholder="Nome do evento"
                />
              </div>

              <div class="flex">
                <div class="input-wrapper flex-1">
                  <label for="start-date">Início</label>
                  <input
                    type="datetime-local"
                    id="start-date"
                    name="start-date"
                    lang="pt-BR"
                    required
                  />
                </div>

                <div class="input-wrapper flex-1">
                  <label for="end-date">Fim</label>
                  <input
                    type="datetime-local"
                    id="end-date"
                    name="end-date"
                    lang="pt-BR"
                    required
                  />
                </div>
              </div>

              <div class="flex">
                <div class="input-wrapper flex-1">
                  <label for="event-type">Tipo</label>
                  <div class="radio-group">
                    <label class="radio-option" for="event-type-presential">
                      <input
                        type="radio"
                        id="event-type-presential"
                        name="event-type"
                        value="presential"
                        checked
                      />
                      <span class="radio-option-content">
                        <img
                          src="assets/icons/building-2.svg"
                          alt=""
                          aria-hidden="true"
                        />
                        <span>Presencial</span>
                      </span>
                    </label>

                    <label class="radio-option" for="event-type-online">
                      <input
                        type="radio"
                        id="event-type-online"
                        name="event-type"
                        value="online"
                      />
                      <span class="radio-option-content">
                        <img
                          src="assets/icons/video.svg"
                          alt=""
                          aria-hidden="true"
                        />
                        <span>Online</span>
                      </span>
                    </label>
                  </div>
                </div>

                <div class="input-wrapper flex-1">
                  <label for="local">Local</label>
                  <input
                    type="text"
                    id="local"
                    name="local"
                    placeholder="Link ou endereço"
                  />
                </div>
              </div>

              <div class="input-wrapper">
                <label for="description">Descrição</label>
                <textarea
                  id="description"
                  name="description"
                  placeholder="Escreva sobre os detalhes do evento"
                  rows="6"
                ></textarea>
              </div>
            </fieldset>

            <fieldset class="customization">
              <div class="section-header">
                <img
                  src="./assets/icons/paintbrush-vertical.svg"
                  alt="Paintbrush Icon"
                />
                <h1>Personalização</h1>
              </div>

              <div class="input-wrapper">
                <label>Cor principal</label>

                <div class="color-radio-group">
                  <label class="color-radio-option">
                    <input type="radio" name="main-color" value="brand-light" />
                    <span
                      class="color-radio-swatch"
                      style="--color-swatch: var(--brand-light)"
                      aria-hidden="true"
                    ></span>
                  </label>

                  <label class="color-radio-option">
                    <input type="radio" name="main-color" value="brand-light" />
                    <span
                      class="color-radio-swatch"
                      style="--color-swatch: var(--purple)"
                      aria-hidden="true"
                    ></span>
                  </label>

                  <label class="color-radio-option">
                    <input type="radio" name="main-color" value="brand-light" />
                    <span
                      class="color-radio-swatch"
                      style="--color-swatch: var(--fuschia)"
                      aria-hidden="true"
                    ></span>
                  </label>

                  <label class="color-radio-option">
                    <input type="radio" name="main-color" value="brand-light" />
                    <span
                      class="color-radio-swatch"
                      style="--color-swatch: var(--pink)"
                      aria-hidden="true"
                    ></span>
                  </label>

                  <label class="color-radio-option">
                    <input type="radio" name="main-color" value="brand-light" />
                    <span
                      class="color-radio-swatch"
                      style="--color-swatch: var(--orange)"
                      aria-hidden="true"
                    ></span>
                  </label>

                  <label class="color-radio-option">
                    <input type="radio" name="main-color" value="brand-light" />
                    <span
                      class="color-radio-swatch"
                      style="--color-swatch: var(--yellow)"
                      aria-hidden="true"
                    ></span>
                  </label>

                  <label class="color-radio-option">
                    <input type="radio" name="main-color" value="brand-light" />
                    <span
                      class="color-radio-swatch"
                      style="--color-swatch: var(--lime)"
                      aria-hidden="true"
                    ></span>
                  </label>

                  <label class="color-radio-option">
                    <input type="radio" name="main-color" value="brand-light" />
                    <span
                      class="color-radio-swatch"
                      style="--color-swatch: var(--green)"
                      aria-hidden="true"
                    ></span>
                  </label>

                  <label class="color-radio-option">
                    <input type="radio" name="main-color" value="brand-light" />
                    <span
                      class="color-radio-swatch"
                      style="--color-swatch: var(--cyan)"
                      aria-hidden="true"
                    ></span>
                  </label>

                  <label class="color-radio-option">
                    <input type="radio" name="main-color" value="brand-light" />
                    <span
                      class="color-radio-swatch"
                      style="--color-swatch: var(--navy)"
                      aria-hidden="true"
                    ></span>
                  </label>

                  <label class="color-radio-option">
                    <input type="radio" name="main-color" value="brand-light" />
                    <span
                      class="color-radio-swatch"
                      style="--color-swatch: var(--purple)"
                      aria-hidden="true"
                    ></span>
                  </label>
                </div>
              </div>

              <div class="input-wrapper">
                <label>Tema do evento</label>

                <div class="theme-radio-group">
                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="birthday" checked />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/Image.png"
                        alt="Birthday Theme Image"
                      />
                      <span>Aniversário</span>
                    </span>
                  </label>

                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="kids" />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/image-3.png"
                        alt="Kids Party Theme Image"
                      />
                      <span>Infantil</span>
                    </span>
                  </label>

                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="graduation" />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/image-4.png"
                        alt="Graduation Theme Image"
                      />
                      <span>Formatura</span>
                    </span>
                  </label>

                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="marriage" />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/image-5.png"
                        alt="Marriage Theme Image"
                      />
                      <span>Casamento</span>
                    </span>
                  </label>

                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="baby-shower" />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/image-6.png"
                        alt="Baby Shower Theme Image"
                      />
                      <span>Chá de bebê</span>
                    </span>
                  </label>

                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="bridal-shower" />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/image-7.png"
                        alt="Bridal Shower Theme Image"
                      />
                      <span>Chá de panela</span>
                    </span>
                  </label>

                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="carnival" />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/image-8.png"
                        alt="Carnival Theme Image"
                      />
                      <span>Carnaval</span>
                    </span>
                  </label>

                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="easter" />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/image-9.png"
                        alt="Easter Theme Image"
                      />
                      <span>Páscoa</span>
                    </span>
                  </label>

                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="saint-john" />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/image-10.png"
                        alt="Saint John Theme Image"
                      />
                      <span>São João</span>
                    </span>
                  </label>

                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="Halloween" />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/image-11.png"
                        alt="Halloween Theme Image"
                      />
                      <span>Halloween</span>
                    </span>
                  </label>

                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="christmas" />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/image-2.png"
                        alt="Cristmas Theme Image"
                      />
                      <span>Natal</span>
                    </span>
                  </label>

                  <label class="theme-radio-option">
                    <input type="radio" name="theme" value="other" />
                    <span class="theme-radio-content">
                      <img
                        src="assets/images/image-1.png"
                        alt="Other Theme Image"
                      />
                      <span>Outro</span>
                    </span>
                  </label>
                </div>
              </div>

              <div class="input-wrapper flex">
                <div class="flex-1">
                  <label>Estilo</label>

                  <div class="style-toggle-field">
                    <label class="style-toggle" for="event-style-toggle">
                      <input type="checkbox" id="event-style-toggle" />
                      <span class="style-toggle-ui" aria-hidden="true">
                        <span class="style-toggle-thumb"></span>
                      </span>
                      <span class="style-toggle-text style-toggle-text-off"
                        >Escuro</span
                      >
                    </label>
                  </div>
                </div>

                <div class="flex-2">
                  <label for="cover-photo">Foto de capa</label>

                  <div class="file-upload">
                    <input
                      type="file"
                      id="cover-photo"
                      name="cover-photo"
                      class="file-input-hidden"
                      accept="image/*"
                    />
                    <label for="cover-photo" class="file-upload-button"
                      >Selecionar</label
                    >
                    <span class="file-upload-name"
                      >Nenhum arquivo selecionado</span
                    >
                  </div>
                </div>
              </div>
            </fieldset>

            <fieldset class="contact">
              <div class="section-header">
                <img src="/assets/icons/contact.svg" alt="Contact Icon">
                <h1>Dados para contato</h1>
              </div>

              <div class="input-wrapper">
                <label for="guest-name">Nome</label>
                <input type="text" name="guest-name" id="guest-name" placeholder="Nome completo" required aria-describedby="guest-name-error">
                <p class="field-error" id="guest-name-error">
                  <img src="assets/icons/circle-alert.svg" alt="Error Icon" aria-hidden="true">
                  Campo obrigatório
                </p>
              </div>

              <div class="input-wrapper flex">
                <div class="flex-1">
                  <label for="guest-email">E-mail</label>
                  <input type="email" name="guest-email" id="guest-email" placeholder="exemplo@email.com">
                </div>

                <div class="flex-1">
                  <label for="guest-phone">Telefone</label>
                  <input type="text" name="guest-phone" id="guest-phone" placeholder="(99) 99999-9999">
                </div>
              </div>
            </fieldset>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
