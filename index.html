<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitation Form</title>
    <link rel="stylesheet" href="styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside>
        <div class="aside-container">
          <header>
            <img src="assets/images/Logo.svg" alt="Logo Image" />
            <div class="aside-header-text">
              <h1>Festivite</h1>
              <p>Crie um convite digital para o seu evento</p>
            </div>
          </header>
        </div>
      </aside>
      <main>
        <div class="main-container">
          <h1>Crie seu convite</h1>

          <form method="post" enctype="multipart/form-data">
            <fieldset class="about">
              <div class="header">
                <img src="assets/icons/calendar.svg" alt="Calendar Icon" />
                <h1>Sobre o evento</h1>
              </div>

              <div class="input-wrapper">
                <label for="eventname">Título</label>
                <input
                  type="text"
                  for="eventname"
                  placeholder="Nome do evento"
                />
              </div>

              <div class="flex">
                <div class="input-wrapper flex-1">
                  <label for="start-date">Início</label>
                  <input
                    type="date"
                    id="start-date"
                    name="start-date"
                    lang="pt-BR"
                    required
                  />
                </div>

                <div class="input-wrapper flex-1">
                  <label for="end-date">Fim</label>
                  <input
                    type="date"
                    id="end-date"
                    name="end-date"
                    lang="pt-BR"
                    required
                  />
                </div>
              </div>
            </fieldset>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
